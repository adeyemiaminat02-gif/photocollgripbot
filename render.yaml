services:
  - type: web
    name: photocollgripbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PORT
        value: 10000
      - key: SESSION_TIMEOUT_MINUTES
        value: 15
      - key: MAX_PHOTOS_PER_SESSION
        value: 16
